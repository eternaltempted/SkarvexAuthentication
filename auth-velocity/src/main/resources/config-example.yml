# Connecting to your database to store users' data
database:
  url: ""
  username: "root"
  password: "root"

# Server names configured in the velocity.toml
servers:
  initial-server: "auth"
  forward-server: "lobby"

login:
  # How many attempts the player uses to log in.
  attempts: 5
  # The duration of time the player is allowed to be in the server until the password is entered.
  timeout: 60

register:
  # Minimum characters of the password (recommended: 4)
  min-password-chars: 4

# Messages section (using MiniMessage formatting)
# Be aware that using deprecated code colors affect the way the messages are printed
# More information: https://docs.papermc.io/adventure/minimessage/

messages:
  already-registered: "<white>You are already registered!"
  already-logged: "<white>You are already logged in!"
  not-registered: "<white>You are not registered yet. Please use <dark_purple>/register [password]</dark_purple>"
  not-logged: "<white>You are not logged in yet. Please use <dark_purple>/login [password]</dark_purple>"
  insufficient-characters: "<white>Please use a minimum of <dark_purple>4 characters</dark_purple>"
  wrong-credentials: "<white>You entered the wrong password. Please try again!"
  timeout: "<red>Authentication timed out. Please try again.</red>"

  register:
    usage: "<dark_purple><bold>AUTH</bold></dark_purple> <dark_gray><bold>:: </bold></dark_gray> <white>Register - <dark_purple>/register [password]</dark_purple>"
    success: "<green>You have successfully registered!"

  login:
    usage: "<dark_purple><bold>AUTH</bold></dark_purple> <dark_gray><bold>:: </bold></dark_gray> <white>Login - <dark_purple>/login [password]</dark_purple>"
    success: "<green>You have successfully logged in!"
    kick-screen: "
    <red>Access denied.</red>
    \n<red>Too many failed login attempts.</red>
    \n\n<red>Please try again in <time>.</red>
    "

  logout:
    usage: "<dark_purple><bold>AUTH</bold></dark_purple> <dark_gray><bold>:: </bold></dark_gray> <white>Logout - <dark_purple>/logout</dark_purple>"
    kick-screen: "<red>You have been logged out by own choice. \nPlease reconnect the server if it was made by the mistake."

  changepass:
    usage: "<dark_purple><bold>AUTH</bold></dark_purple> <dark_gray><bold>:: </bold></dark_gray> <white>Change password - <dark_purple>/changepass [old password] [new password]</dark_purple>"
    kick-screen: "<green>Your password has been changed successfully. \n\n<white>Please rejoin the server and log in using your new password."